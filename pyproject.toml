[project]
name = "Council-of-Translation"
version = "0.12.0"
description = "MCP server for multi-agent localization translation review"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastmcp>=2.13.0.2",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
]

[project.scripts]
council_of_translation = "council_of_translation.server:main"
mcp_council_of_translation = "council_of_translation.server:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-dir]
"" = "src"
